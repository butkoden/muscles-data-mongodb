name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: main
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ./muscles-data --no-deps
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "pymongo>=4.0,<5.0"
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist

  integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: main
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./muscles-data --no-deps
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "pymongo>=4.0,<5.0"
      - run: python -m pytest -q -m integration
        env:
          MUSCLES_DATA_INTEGRATION: "1"
          MONGODB_URL: mongodb://127.0.0.1:27017
